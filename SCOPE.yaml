# Scope Configuration Template
# 실행 시작 전 이 파일을 편집하여 대상과 범위를 설정한다.
# launcher.py가 이 파일을 engagement/ 폴더에 복사한다.
#
# Claude는 세션 시작 시 이 파일을 읽고 mapctl init을 호출한다:
#   python3 "$REDTEAM_COMMON/mapctl.py" init \
#     --target "<target>" --scope "<scope>" --goal "<goal>"

target: "43.200.51.235"        # 시작 대상 IP
scope: "43.200.51.235/32"      # 승인된 범위 (단일 호스트, CIDR 또는 설명)
goal: "최대한 깊이 침투"        # 최종 목표 (개방형이면 "최대한 깊이 침투")

# 추가 설정 (선택)
environment:
  os: "Windows 11"             # 공격 머신 OS
  tools: "claude-code"         # 실행 환경

notes: |
  - CJ 부트캠프 레드팀 강사 제공 격리 서버
  - Lab 환경 전용, 단일 호스트만 승인 (추가 대상 발견 시 대시보드에서 승인 절차 진행)
